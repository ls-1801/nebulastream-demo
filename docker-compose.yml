# NebulaStream live-metrics demo.
#
# One command:
#     docker compose -f github.com/ls-1801/nebulastream-demo.git up
#
# Topology of this demo:
#
#     metrics-feeder  --(TCP, JSON lines)-->  worker  --(Print sink, JSON)-->  worker stdout
#         (python)                          (nebulastream/worker)
#                                                 ^
#                                                 | gRPC (start / status / stop)
#                                           coordinator
#                                        (nebulastream/nes-cli)
#
# * metrics-feeder : a tiny python TCP server that emits one JSON object per second
#                    describing its own CPU / memory / network usage.
# * worker         : the NebulaStream engine. It connects out to the feeder as a TCP
#                    source, runs a 5-second tumbling-window aggregation, and prints
#                    the windowed results as JSON to its stdout
#                    (view with `docker compose logs -f worker`).
# * coordinator    : runs nes-cli in a bash loop. It `start`s the query, traps SIGTERM
#                    to `stop` the query on shutdown, and `status`-monitors it in between.
#
# Everything (topology, feeder script, coordinator script) is embedded below via
# `configs`, so this single file is fully self-contained.

services:
  # ---------------------------------------------------------------------------
  # NebulaStream engine. Identified in the topology as `worker:8080` (gRPC).
  # ---------------------------------------------------------------------------
  worker:
    image: nebulastream/worker:latest
    command: ["--grpc=0.0.0.0:8080", "--data_address=worker:9090"]
    healthcheck:
      # grpc_health_probe ships inside the runtime image
      test: ["CMD", "/bin/grpc_health_probe", "-addr=127.0.0.1:8080"]
      interval: 1s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Python TCP server. The worker's TCP source connects to `metrics-feeder:5000`.
  # ---------------------------------------------------------------------------
  metrics-feeder:
    image: python:3.12-slim
    command: ["python", "-u", "/feeder.py"]
    configs:
      - source: feeder_py
        target: /feeder.py

  # ---------------------------------------------------------------------------
  # nes-cli driver: start -> trap-stop -> monitor.
  # The base image's entrypoint is `nes-cli`; we override it to run our script.
  # XDG_STATE_HOME=/state (set in the image) keeps the query-id mapping that
  # `start` writes and `stop`/`status` read.
  # ---------------------------------------------------------------------------
  coordinator:
    # nes-cli plus jq
    build:
      dockerfile_inline: |
        FROM nebulastream/nes-cli:latest
        RUN apt-get update \
         && apt-get install -y --no-install-recommends jq \
         && rm -rf /var/lib/apt/lists/*
    entrypoint: ["/bin/bash", "/demo/run.sh"]
    working_dir: /tmp
    depends_on:
      worker:
        condition: service_healthy
      metrics-feeder:
        condition: service_started
    configs:
      - source: topology
        target: /demo/topology.yaml
      - source: run_sh
        target: /demo/run.sh

configs:
  # ===========================================================================
  # NebulaStream topology: TCP/JSON source -> tumbling window -> Print sink.
  # Field names are UPPER-CASED by NebulaStream, so the feeder emits UPPER-CASE
  # JSON keys (TS, CPU_PCT, ...) to match the schema below.
  # ===========================================================================
  topology:
    content: |
      query: |
        SELECT start as `start`, end as `end`,
               avg_cpu_pct as `avg_cpu_pct`,
               max_mem_bytes as `max_mem_bytes`, 
               avg_net_rx_bps as `avg_net_rx_bps`
        FROM(       
          SELECT
            start, end,
            AVG(CPU_PCT)    AS avg_cpu_pct,
            MAX(MEM_BYTES)  AS max_mem_bytes,
            AVG(NET_RX_BPS) AS avg_net_rx_bps
          FROM metrics
          WINDOW TUMBLING(TS, SIZE 5 SEC)
        )
        INTO metrics_window

      logical:
        - name: metrics
          schema:
            - name: ts
              type: UINT64
            - name: cpu_pct
              type: FLOAT64
            - name: mem_bytes
              type: UINT64
            - name: net_rx_bps
              type: FLOAT64

      physical:
        - logical: metrics
          host: worker:8080
          type: TCP
          parser_config:
            type: JSON
          source_config:
            flush_interval_ms: 100
            socket_host: metrics-feeder
            socket_port: "5000"

      sinks:
        - name: metrics_window
          host: worker:8080
          type: Print
          schema:
            - name: "`start`"
              type: UINT64
            - name: "`end`"
              type: UINT64
            - name: "`avg_cpu_pct`"
              type: FLOAT64
            - name: "`max_mem_bytes`"
              type: UINT64
            - name: "`avg_net_rx_bps`"
              type: FLOAT64
          config:
            output_format: JSON
          parser_config: { }

      workers:
        - host: worker:8080
          data_address: worker:9090
          max_operators: 10000

  # ===========================================================================
  # The metrics feeder. Same algorithm as the reference snippet, wrapped in a
  # TCP server and emitting UPPER-CASE JSON keys (one object per line).
  # ===========================================================================
  feeder_py:
    content: |
      import json, socket, time, signal

      class Shutdown(Exception):
          pass

      def _shutdown(signum, frame):
          raise Shutdown

      def cpu_usec():
          for l in open("/sys/fs/cgroup/cpu.stat"):
              if l.startswith("usage_usec"):
                  return int(l.split()[1])
          return 0

      def rx_bytes():
          return sum(int(l.split()[1]) for l in open("/proc/net/dev").readlines()[2:])

      def mem_bytes():
          return int(open("/sys/fs/cgroup/memory.current").read())

      def stream(conn):
          prev_c, prev_r, t = cpu_usec(), rx_bytes(), time.time()
          while True:
              time.sleep(1)
              c, r, now = cpu_usec(), rx_bytes(), time.time()
              rec = {
                  "TS": int(now * 1000),
                  "CPU_PCT": (c - prev_c) / 1e6 / (now - t) * 100,
                  "MEM_BYTES": mem_bytes(),
                  "NET_RX_BPS": (r - prev_r) / (now - t),
              }
              conn.sendall((json.dumps(rec) + "\n").encode())
              prev_c, prev_r, t = c, r, now

      def main():
          signal.signal(signal.SIGTERM, _shutdown)
          srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 5000))
          srv.listen(1)
          print("metrics-feeder listening on 0.0.0.0:5000", flush=True)
          try:
              while True:
                  conn, addr = srv.accept()
                  print(f"client connected: {addr}", flush=True)
                  try:
                      stream(conn)
                  except (BrokenPipeError, ConnectionResetError, OSError) as e:
                      print(f"client disconnected: {e}", flush=True)
                  finally:
                      conn.close()
          except (Shutdown, KeyboardInterrupt):
              print("metrics-feeder shutting down", flush=True)
          finally:
              srv.close()

      main()

  # ===========================================================================
  # Coordinator script: start the query, register a stop hook, then monitor.
  # `$` is doubled ($$) to escape Compose interpolation -> real `$` at runtime.
  # ===========================================================================
  run_sh:
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      TOPOLOGY=/demo/topology.yaml

      echo "submitting query from $$TOPOLOGY ..."
      QID="$$(nes-cli -t "$$TOPOLOGY" start)"
      echo "query started, id = $$QID"

      stop_query() {
        echo "stopping query $$QID ..."
        nes-cli -t "$$TOPOLOGY" stop "$$QID" || true
        echo "stopped."
        exit 0
      }
      trap stop_query INT TERM

      echo "monitoring query (stop the demo with: docker compose down)"
      while true; do
        # `status` returns an array: the global query plus one entry per worker.
        # Print only the global query's status (the entry without a `local_query_id`).
        STATUS="$$(nes-cli -t "$$TOPOLOGY" status "$$QID" \
          | jq -r '.[] | select(has("local_query_id") | not) | .query_status')" \
          || STATUS="unknown (status check failed; is the worker reachable?)"
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) :: $$QID :: $$STATUS"
        # background sleep + wait so SIGTERM interrupts immediately
        sleep 5 &
        wait $$!
      done
